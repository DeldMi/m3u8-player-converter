<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3U8 Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <section class="player-area">
      <video id="video" controls playsinline></video>

      <div id="emptyState" class="empty-state">
        <div class="play-icon">▶</div>
        <h1>M3U8 Studio</h1>
        <p>Cole uma URL M3U8 e adicione à fila.</p>
      </div>

      <!-- Reabre o painel sem alterar o tamanho do player. -->
      <button id="showSidebar" class="floating-menu" title="Mostrar menu">☰</button>
    </section>

    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <div>
          <strong>M3U8 Studio</strong>
          <span>Player & Downloader</span>
        </div>

        <button id="hideSidebar" class="menu-button" title="Ocultar painel">☰</button>
      </header>

      <section class="add-box">
        <label for="url">URL M3U8</label>
        <textarea id="url" rows="3" placeholder="https://servidor.com/video/playlist.m3u8"></textarea>

        <label for="title">Nome do vídeo (opcional)</label>
        <input id="title" type="text" placeholder="Meu vídeo">

        <div class="actions">
          <button id="playBtn" class="secondary">▶ Assistir</button>
          <button id="addBtn" class="primary">＋ Adicionar</button>
        </div>

        <button id="pasteBtn" class="paste">📋 Colar da área de transferência</button>
      </section>

      <section class="queue-section">
        <div class="section-title">
          <span>Fila de vídeos</span>
          <span id="count">0</span>
        </div>

        <select id="sortMode" class="sort-select" title="Ordenar fila">
          <option value="added">Ordem adicionada</option>
          <option value="alpha">A → Z</option>
          <option value="alphaDesc">Z → A</option>
          <option value="status">Status</option>
        </select>

        <label class="auto-next">
          <input id="autoNext" type="checkbox">
          Reproduzir fila automaticamente
        </label>

        <div id="queue" class="queue"></div>
      </section>

      <section class="tools">
        <div class="section-title">Opções</div>
        <button id="clearCompleted">🧹 Limpar concluídos</button>
        <button id="openCurrent">↗ Abrir M3U8 atual</button>
      </section>

      <footer>
        <span>FFmpeg local</span>
        <span id="connection">● conectado</span>
      </footer>
    </aside>
    <div id="notifications" class="notifications" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
